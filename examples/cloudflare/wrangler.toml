# Advanced Cloudflare Workers Configuration for MCP Handler

name = "advanced-mcp-handler"
compatibility_date = "2024-08-07"
compatibility_flags = ["nodejs_compat"]

# Main script for the worker
main = "advanced-worker.ts"

# Environment variables
[vars]
NODE_ENV = "production"
ALLOWED_ORIGINS = "http://localhost:3000,https://yourdomain.com"

# KV namespaces
[[kv_namespaces]]
binding = "MCP_SESSIONS"
id = "your-sessions-kv-namespace-id"
preview_id = "your-sessions-preview-kv-namespace-id"

[[kv_namespaces]]
binding = "COUNTER_KV"
id = "your-counter-kv-namespace-id" 
preview_id = "your-counter-preview-kv-namespace-id"

# Secret environment variables (set via dashboard or CLI)
# wrangler secret put API_KEY

# Build configuration
[build]
command = "npm run build"
cwd = "./"

# Routes configuration (optional)
# [[routes]]
# pattern = "api.yourdomain.com/mcp/*"
# zone_name = "yourdomain.com"

# Development configuration
[env.development]
vars = { NODE_ENV = "development", ALLOWED_ORIGINS = "*" }